[project]
name = "khatib-osc-fr3"
version = "0.1.0"
description = "Operational-space motion and hybrid motion/force control (Khatib, 1987) on a MuJoCo Franka FR3."
requires-python = ">=3.11"
dependencies = [
    "imageio>=2.37.4",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.1",
    "mujoco>=3.11.0",
    "numpy>=2.4.6",
    "robot-descriptions>=3.1.0",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/khatib_osc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
